<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đại Chiến Pháp Sư Bựa</title>
    <style>
        * { box-sizing: border-box; touch-action: none; user-select: none; }
        body { margin: 0; padding: 0; background: #1a1a2e; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; color: white; }
        #game-container { position: relative; width: 100vw; height: 100vh; max-width: 800px; max-height: 450px; background: #16213e; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        canvas { width: 100%; height: 100%; display: block; }
        .controls { position: absolute; bottom: 10px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; pointer-events: none; }
        .joystick-zone { width: 120px; height: 120px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; position: relative; pointer-events: auto; }
        .joystick-stick { width: 50px; height: 50px; background: #e94560; border-radius: 50%; position: absolute; top: 35px; left: 35px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn-group { display: flex; gap: 10px; pointer-events: auto; align-self: flex-end; }
        .btn { width: 60px; height: 60px; border-radius: 50%; border: none; font-weight: bold; font-size: 14px; color: white; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.3); }
        .btn-slap { background: #ff9f43; }
        .btn-skill { background: #00d2d3; }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        #menu { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; z-index: 10; }
        .start-btn { padding: 12px 30px; font-size: 18px; font-weight: bold; background: #ff4757; color: white; border: none; border-radius: 25px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas" width="800" height="450"></canvas>
        <div id="menu">
            <h1>🧙‍♂️ PHÁP SƯ BỰA PvP 💥</h1>
            <p>Dùng Cần Tròn (Joystick) bên dưới để di chuyển!</p>
            <button class="start-btn" onclick="startGame()">CHƠI NGAY!</button>
        </div>
        <div class="controls">
            <div class="joystick-zone" id="joy1"><div class="joystick-stick" id="stick1"></div></div>
            <div class="btn-group">
                <button class="btn btn-slap" id="slap1">VẢ</button>
                <button class="btn btn-skill" id="skill1">SKILL</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let gameRunning = false;

        function startGame() {
            document.getElementById('menu').style.display = 'none';
            gameRunning = true;
            requestAnimationFrame(gameLoop);
        }

        // Joystick Setup
        function setupJoystick(zoneId, stickId, onMove) {
            const zone = document.getElementById(zoneId);
            const stick = document.getElementById(stickId);
            let active = false;

            const handleMove = (e) => {
                if(!active) return;
                const rect = zone.getBoundingClientRect();
                const touch = e.touches ? e.touches[0] : e;
                let x = touch.clientX - rect.left - 60;
                let y = touch.clientY - rect.top - 60;
                let dist = Math.hypot(x, y);
                if(dist > 40) { x = (x/dist)*40; y = (y/dist)*40; }
                stick.style.transform = `translate(${x}px, ${y}px)`;
                onMove(x / 40, y / 40);
            };

            const handleEnd = () => {
                active = false;
                stick.style.transform = `translate(0px, 0px)`;
                onMove(0, 0);
            };

            zone.addEventListener('touchstart', (e) => { active = true; handleMove(e); });
            zone.addEventListener('touchmove', handleMove);
            zone.addEventListener('touchend', handleEnd);
            zone.addEventListener('mousedown', (e) => { active = true; handleMove(e); });
            window.addEventListener('mousemove', handleMove);
            window.addEventListener('mouseup', handleEnd);
        }

        let p1Vel = { x: 0, y: 0 };
        let p1Pos = { x: 400, y: 225 };

        setupJoystick('joy1', 'stick1', (vx, vy) => { p1Vel.x = vx * 5; p1Vel.y = vy * 5; });

        function gameLoop() {
            if(!gameRunning) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Vẽ NV
            p1Pos.x = Math.max(20, Math.min(780, p1Pos.x + p1Vel.x));
            p1Pos.y = Math.max(20, Math.min(430, p1Pos.y + p1Vel.y));

            ctx.fillStyle = '#ff4757';
            ctx.beginPath();
            ctx.arc(p1Pos.x, p1Pos.y, 25, 0, Math.PI * 2);
            ctx.fill();

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
